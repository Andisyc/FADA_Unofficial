# @package _global_
# Independent environment, learner and synchronous collection owners.
# Physical/performance/policy acceptance requires separately authorized runs.
algo:
  runtime_resolver: unilab.algos.torch.fada_official.runtime:resolve_runtime
  algo_log_name: fada_official_ppo
  num_steps_per_env: 24
  max_iterations: 25000
  save_interval: 100
  empirical_normalization: false
  collection:
    mode: synchronous_heterogeneous
    collector_device: cpu
    num_slots: 1
    obs_dim: 322
    critic_dim: 322
    action_dim: 29
    collector_torch_threads: 1
    round_timeout_s: 120.0
    poll_interval_s: 0.05
    initial_episode_progress: true
  episode_statistics:
    window: 100
    statistic: episode_return_mean_last100
  obs_groups:
    actor: [actor]
    critic: [critic]
  actor:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
    distribution_cfg:
      class_name: unilab.algos.torch.fada_official_ppo:OfficialFadaGaussianDistribution
      init_std: 0.8
      std_type: scalar
  critic:
    class_name: rsl_rl.models.MLPModel
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: false
  algorithm:
    class_name: unilab.algos.torch.fada_official_ppo:OfficialFadaPPO
    value_loss_coef: 1.0
    use_clipped_value_loss: true
    clip_param: 0.2
    entropy_coef: 0.01
    num_learning_epochs: 8
    num_mini_batches: 4
    optimizer: adamw
    learning_rate: 1.0e-5
    actor_learning_rate: 1.0e-5
    critic_learning_rate: 1.0e-5
    weight_decay: 0.001
    schedule: adaptive
    gamma: 0.99
    lam: 0.95
    desired_kl: 0.01
    max_grad_norm: 1.0
    normalize_advantage_per_mini_batch: false
    enable_compile: false
    amp: false
    rnd_cfg: null
    symmetry_cfg: null
training:
  task_name: G1OfficialOracleFlat
  sim_backend: mujoco
  oracle_lineage_id: null
  no_play: true
play_profile:
  enabled: true
  env:
    evaluating: true
    randomization_enabled: false
env:
  sim_dt: 0.005
  ctrl_dt: 0.02
  max_episode_seconds: 20.0
  post_step_forward_sensor: true
  control_config:
    action_scale: 0.25
    simulate_action_latency: false
  noise_config:
    level: 0.0
reward:
  scales:
    track_xy: 4.5
    track_yaw: 2.5
    alive: 0.15
    lin_z: -2.0
    ang_xy: -0.05
    joint_vel: -0.001
    joint_acc: -0.00000025
    action_rate: -0.2
    pos_limits: -5.0
    energy: -0.00002
    pose: -0.5
    orientation: -5.0
    world_base_height: -10.0
    gait: 0.5
    slide: -0.2
    clearance: 1.0
    feet_ori: -2.0
    close_feet: -5.0
    undesired: -1.0
